# Локальний стенд пакета «меблі» для ручного тесту (Odoo 19 CE + PostgreSQL 16).
# Запуск із цієї теки: docker compose up -d  →  http://localhost:8069
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - mebli-db:/var/lib/postgresql/data
  odoo:
    # Збірка закріплена: бекап mebli-demo-odoo19.zip знято на 19.0 від 10.11.2026.
    # Старіший образ ламає подання (напр. "hr.employee"."version_revision" field is undefined).
    # Оновили бекап на новішій збірці — оновіть і тег.
    image: odoo:19.0-20261112
    depends_on: [db]
    ports:
      - "8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    command: ["odoo", "--addons-path=/mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons", "--load-language=uk_UA"]
    volumes:
      - ../../addons:/mnt/extra-addons:ro
      - mebli-data:/var/lib/odoo
volumes:
  mebli-db:
  mebli-data:
