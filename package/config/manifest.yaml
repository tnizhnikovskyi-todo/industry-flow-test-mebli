# Конфіг-пакет пакета mebli (A-12, config-as-code (версія 0.3.1), спроба 2, режим fix — модулі A-11 @ 4e0fdda). Формат — config-as-code/references/config-package-format.md.
# Порядок модулів = порядок установки (топологічний за depends; перевірено скриптом за __manifest__.py Odoo 19.0 CE @40e9be2b і package/addons @4e0fdda: порушень 0).
# when: — умова за answers.yaml (профіль коробки VP-01 / VP-03 / VP-04); без when — у всіх профілях light / A / B.
# Профіль light = A без td_mebli_bas (VP-04=false) — AI-A10-05; профіль B = A + td_mebli_multico (VP-03=multi_install_fop) + feature-групи VP-02.
