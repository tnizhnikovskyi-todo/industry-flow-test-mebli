# Календар і листи (AC-004, AC-030).
- id: td_config.event_type_measure
  kind: record
  model: calendar.event.type
  values: {name: "Замір"}
  ac: [AC-001, AC-004]
  source: "addons/calendar/models/calendar_event_type.py (name, color)"
  manual: false
- id: td_config.alarm_mail_1day
  kind: record
  model: calendar.alarm
