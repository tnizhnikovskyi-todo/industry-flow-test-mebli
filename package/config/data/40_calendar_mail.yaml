    name: "Email - 1 день"
    alarm_type: email
    duration: 1
    interval: days
    mail_template_id: "ref:calendar.calendar_template_meeting_reminder"
  ac: [AC-004]
  source: "addons/calendar/data/calendar_data.xml:34 (alarm_mail_1: alarm_type email, mail_template_id calendar_template_meeting_reminder); addons/calendar/models/calendar_alarm.py"
  manual: false
  note: "зв'язку «тип зустрічі -> нагадування» в CE немає (calendar.event.type: name, color); нагадування за замовчуванням для зустрічі «Замір» ставить td_mebli_measure (A-11) — Відкриті питання"
- id: td_config.mail_templates_customer
  kind: mail_template
  model: mail.template
  values: {}
  ac: [AC-030]
  source: "SPEC AC-030; tr/td_mebli_dashboard_notify.md"
  manual: true
  reason: "шаблони «Запис на замір», «Дата монтажу», «Нагадування про доплату», «Нова дата» — data/*.xml модуля td_mebli_notify (A-11, хвиля 2); модуля немає в package/addons гілки кроку"
