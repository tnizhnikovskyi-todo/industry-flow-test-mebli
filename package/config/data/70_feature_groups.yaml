# Feature-групи коробки B (VP-01, VP-02, AC-N.07) — галочки налаштувань td_mebli_base (API G0: group_td_feature_<значення VP-02>,
# implied_group td_mebli_base.group_feature_* -> base.group_user). Застосовується в execute() res.config.settings разом з 80_settings.
# У профілях light / A пункт не застосовується (applies_if VP-01 = B): груп функцій B немає (ризик 4 AC-COVERAGE закрито групами).
- id: td_config.feature_groups_box
  kind: settings
  model: res.config.settings
  values: {group_td_feature_configurator: "{{VP-02:configurator}}",
           group_td_feature_offcut: "{{VP-02:offcut}}",
           group_td_feature_cutting_batch: "{{VP-02:cutting_batch}}",
           group_td_feature_kiosk: "{{VP-02:kiosk}}",
           group_td_feature_quality: "{{VP-02:quality}}",
           group_td_feature_label_scan: "{{VP-02:label_scan}}",
           group_td_feature_change_sign: "{{VP-02:change_sign}}",
           group_td_feature_nbu: "{{VP-02:nbu}}",
           group_td_feature_ai_mapping: "{{VP-02:ai_mapping}}",
           group_td_feature_analog: "{{VP-02:analog}}",
           group_td_feature_shop_board: "{{VP-02:shop_board}}"}
  # {{VP-02:<f>}} = transform VP-02 з vp-map.yaml: true, якщо <f> обрано у VP-02
  applies_if: {VP-01: B}
  requires_module: td_mebli_base
  ac: [AC-N.07, AC-011, AC-012, AC-037, AC-038, AC-050, AC-057, AC-058, AC-059, AC-060, AC-062, AC-071, AC-072, AC-073, AC-074, AC-075, AC-079, AC-088, AC-120, AC-121]
  source: "package/addons/td_mebli_base/models/res_config_settings.py (TD_FEATURES, group_td_feature_*); odoo/addons/base/models/res_config.py (implied_group)"
  manual: false
