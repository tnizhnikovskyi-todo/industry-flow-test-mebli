<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Меблі на замовлення · пакет mebli на базі Odoo 19 - прототип</title>
<style>
:root{--acc:#714B67;--txt:#212529;--bg:#f9fafb;--bd:#dee2e6;--ok:#198754;--warn:#b58105;--bad:#dc3545}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--txt);background:var(--bg)}
#banner{background:#fff3cd;color:#664d03;text-align:center;padding:4px 8px;font-weight:600;border-bottom:1px solid #ffe69c}
#topbar{display:flex;align-items:center;gap:16px;background:var(--acc);color:#fff;padding:8px 16px}
#topbar .pkg{font-weight:600}#topbar select{margin-left:auto;padding:2px 6px}
#ctrl{display:flex;align-items:center;gap:8px;padding:8px 16px;background:#fff;border-bottom:1px solid var(--bd)}
#crumbs{color:#6c757d;margin-right:auto}
main{padding:16px;max-width:1100px;margin:0 auto}
h1{font-size:22px;margin:0 0 12px}
button{font:inherit;padding:5px 12px;border:1px solid var(--bd);background:#fff;border-radius:4px;cursor:pointer}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--bd)}
th,td{padding:6px 10px;border-bottom:1px solid var(--bd);text-align:left}
th{background:#f1f3f5}tr.row{cursor:pointer}tr.row:hover{background:#f8f0f6}
.sheet{background:#fff;border:1px solid var(--bd);padding:16px;border-radius:4px}
.statusbar{display:flex;gap:4px;margin-bottom:12px}
.statusbar span{padding:3px 12px;border:1px solid var(--bd);background:#fff;border-radius:12px;color:#6c757d}
.statusbar span.cur{background:var(--acc);border-color:var(--acc);color:#fff}
.f{display:flex;gap:8px;margin:8px 0;align-items:center}.f label{width:200px;color:#6c757d}
.f .v{flex:1;padding:3px 8px;border-bottom:1px solid var(--bd);min-height:26px}
.hint{font-size:12px;color:var(--warn);margin-left:8px}
.badge{padding:1px 8px;border-radius:10px;background:#e9ecef;font-size:12px}
.kanban{display:flex;gap:12px;overflow-x:auto}.col{min-width:220px;flex:1;background:#eef0f2;border-radius:4px;padding:8px}
.col h3{margin:0 0 8px;font-size:14px}.card{background:#fff;border:1px solid var(--bd);border-radius:4px;padding:8px;margin-bottom:8px;cursor:pointer}
.tiles{display:flex;flex-wrap:wrap;gap:12px}.tile{background:#fff;border:1px solid var(--bd);padding:12px 20px;border-radius:4px;min-width:170px}
.tile b{display:block;font-size:24px}
.actions{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap}
.modal{max-width:520px;margin:20px auto;background:#fff;border:1px solid var(--bd);border-radius:6px;padding:16px;box-shadow:0 4px 16px rgba(0,0,0,.15)}
#cap{position:fixed;left:0;right:0;bottom:0;background:rgba(33,37,41,.88);color:#fff;padding:8px 16px;font-size:16px;display:none}
.err{color:var(--bad);padding:16px}
</style>
</head>

<div id="ctrl"><span id="crumbs"></span></div>
<main id="view"></main>
<div id="cap" data-testid="caption"></div>

<script>
(function(){
'use strict';
var SC=JSON.parse(document.getElementById('screens-json').textContent);
var DATA=JSON.parse(document.getElementById('data-json').textContent);
var E=DATA.entities, byId={}, cur={}, role=null;
SC.screens.forEach(function(s){byId[s.id]=s;});
function el(tag,attrs,kids){var n=document.createElement(tag);
  Object.keys(attrs||{}).forEach(function(k){if(k==='text')n.textContent=attrs[k];else if(k==='on')Object.keys(attrs.on).forEach(function(e){n.addEventListener(e,attrs.on[e]);});else n.setAttribute(k,attrs[k]);});
  (kids||[]).forEach(function(c){n.appendChild(c);});return n;}
function rec(model,id){return (E[model]||[]).filter(function(r){return String(r.id)===String(id);})[0];}
function label(model,id){var r=rec(model,id);return r?(r.name||r.title||r.id):'';}
function calc(f,r){var c=f.calc;if(!c)return r[f.name];
  if(c.formula==='const')return r[f.name];
  var args=c.inputs.map(function(i){var v=Number(r[i]);return isNaN(v)?0:v;});
  try{var v=Function.apply(null,c.inputs.concat('return ('+c.formula+');')).apply(null,args);
    return Math.round(v*100)/100;}catch(e){return r[f.name];}}
function show(f,r){var v=calc(f,r);
  if(f.kind==='m2o')return label(f.comodel,v);
  if(f.kind==='status')return String(v==null?'':v);
  return v==null?'':String(v);}
function hintNode(f){return f.calc?el('span',{'class':'hint','data-testid':'hint-'+f.name,text:f.calc.hint}):null;}
function formScreen(s){var r=cur[s.id]||rec(s.model,cur[s.model])||(E[s.model]||[])[0]||{};
  cur[s.model]=r.id;var box=el('div',{'class':'sheet'});
  if(s.statusbar){var sb=el('div',{'class':'statusbar'});
    s.statusbar.forEach(function(st){var on=r.state===st;sb.appendChild(el('span',{'class':on?'cur':'','data-testid':on?'statusbar-current':'state-'+st,text:st}));});box.appendChild(sb);}
  (s.fields||[]).forEach(function(f){var row=el('div',{'class':'f'},[el('label',{text:f.label}),el('div',{'class':'v','data-testid':'field-'+f.name,text:show(f,r)})]);
    var h=hintNode(f);if(h)row.appendChild(h);box.appendChild(row);});return box;}
function listScreen(s){var cols=s.columns||(s.fields||[]).map(function(f){return f.name;});
  var fm={};(s.fields||[]).forEach(function(f){fm[f.name]=f;});
  var t=el('table',{'data-testid':'list'}),hd=el('tr');
  cols.forEach(function(c){hd.appendChild(el('th',{text:(fm[c]&&fm[c].label)||c}));});t.appendChild(hd);
  (E[s.model]||[]).forEach(function(r){var tr=el('tr',{'class':'row','data-testid':'row-'+r.id,on:{click:function(){openRecord(s.model,r.id);}}});
    cols.forEach(function(c){var f=fm[c]||{name:c,kind:'char'};tr.appendChild(el('td',{text:show(f,r)}));});t.appendChild(tr);});return t;}
function kanbanScreen(s){var key=s.group_by||'state',groups=[];
  (E[s.model]||[]).forEach(function(r){if(groups.indexOf(r[key])<0)groups.push(r[key]);});
  var order=s.statusbar||groups;var k=el('div',{'class':'kanban'});
  order.forEach(function(g){var col=el('div',{'class':'col'},[el('h3',{text:String(g)})]);
    (E[s.model]||[]).filter(function(r){return r[key]===g;}).forEach(function(r){
      col.appendChild(el('div',{'class':'card','data-testid':'card-'+r.id,text:String(r.name||r.title||r.id),on:{click:function(){openRecord(s.model,r.id);}}}));});
    k.appendChild(col);});return k;}
function dashScreen(s){var box=el('div',{'class':'tiles'});
  (s.fields||[]).forEach(function(f){var rows=E[s.model]||[],r=rows[0]||{},val=f.calc?calc(f,r):(rows.length);
    var t=el('div',{'class':'tile','data-testid':'tile-'+f.name},[el('b',{text:String(val==null?'':val)}),el('span',{text:f.label})]);
    var h=hintNode(f);if(h)t.appendChild(h);box.appendChild(t);});return box;}
function wizardScreen(s){var m=formScreen(s);m.className='modal';return m;}
function openRecord(model,id){cur[model]=id;

function act(s,a){var r=rec(s.model,cur[s.model]);
  if(a.set&&r)Object.keys(a.set).forEach(function(k){r[k]=a.set[k];});
  if(a.create){var n={id:a.create+'-new-'+((E[a.create]||[]).length+1)};
    Object.keys(a.set||{}).forEach(function(k){n[k]=a.set[k];});(E[a.create]=E[a.create]||[]).push(n);cur[a.create]=n.id;}
  if(a.go)location.hash='#/'+a.go;else render();}
function render(){var v=document.getElementById('view');v.textContent='';
  var id=(location.hash.replace(/^#\//,'')||SC.start).split('?')[0],s=byId[id];
  if(!s){v.appendChild(el('div',{'class':'err','data-testid':'not-found',text:'Екран не знайдено: '+id}));return;}
  document.getElementById('crumbs').textContent=SC.package+' / '+s.title;
  v.appendChild(el('h1',{'data-testid':'screen-title',text:s.title}));
  if(s.added_for)v.appendChild(el('div',{'class':'hint',text:'Додано для '+s.added_for+', немає в screens.md'}));
  var body={list:listScreen,form:formScreen,kanban:kanbanScreen,dashboard:dashScreen,wizard:wizardScreen}[s.type];
  if(body)v.appendChild(body(s));
  var ac=el('div',{'class':'actions'});
  (s.actions||[]).forEach(function(a){ac.appendChild(el('button',{'class':a.primary?'primary':'','data-testid':a.testid,text:a.label,on:{click:function(){act(s,a);}}}));});
  v.appendChild(ac);}
